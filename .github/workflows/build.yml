# Builds the APK on GitHub's runners and publishes it.
#
# Two triggers:
#   - every push to main, and manual runs  -> debug APK uploaded as a run artifact
#   - a pushed tag like v0.1.11            -> same APK also attached to a GitHub Release
#
# Debug rather than release on purpose: a release APK is unsigned without a keystore,
# and Android won't install an unsigned APK. The debug signing key is generated by the
# build itself, which is all sideloading onto a Karoo needs. See the release job below
# for what to do if you ever want a properly signed build.
name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This repo has no gradlew/wrapper jar committed, so Gradle is provisioned here
      # instead. Version matches gradle/wrapper/gradle-wrapper.properties — keep the two
      # in step if you bump one.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        env:
          # settings.gradle.kts reads gpr.user/gpr.key first and falls back to these two
          # env vars, which is why no gradle.properties changes are needed here.
          #
          # karoo-ext is public but GitHub Packages requires auth to read it anyway. The
          # automatic GITHUB_TOKEN is scoped to this repository and is unreliable for
          # reading another org's packages, so this uses a PAT you create yourself — see
          # the README section added with this workflow.
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.KAROO_EXT_TOKEN }}
        run: gradle --no-daemon assembleDebug

      # The app module renames its own output (see app/build.gradle.kts), so this glob
      # picks up karoo-insta360-<version>-debug.apk rather than a generic app-debug.apk.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: karoo-insta360-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
