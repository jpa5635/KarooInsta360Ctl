# Builds the APK on GitHub's runners and publishes it.
#
# Two triggers:
#   - every push to main, and manual runs  -> APK uploaded as a run artifact
#   - a pushed tag like v1.0.0             -> same APK also attached to a GitHub Release
#
# Builds the RELEASE variant as of 1.0.0. The old comment here said debug was deliberate
# because a release APK would be unsigned — that stopped being true when the committed
# shared keystore was added (see app/build.gradle.kts), which both variants now use. Same
# key means a release APK installs straight over an existing debug install with saved
# cameras and profiles intact.
name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This repo has no gradlew/wrapper jar committed, so Gradle is provisioned here
      # instead. Version matches gradle/wrapper/gradle-wrapper.properties — keep the two
      # in step if you bump one.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        env:
          # settings.gradle.kts reads gpr.user/gpr.key first and falls back to these two
          # env vars, which is why no gradle.properties changes are needed here.
          #
          # karoo-ext is public but GitHub Packages requires auth to read it anyway. The
          # automatic GITHUB_TOKEN is scoped to this repository and is unreliable for
          # reading another org's packages, so this uses a PAT you create yourself — see
          # the README section added with this workflow.
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.KAROO_EXT_TOKEN }}
        run: gradle --no-daemon assembleRelease

      # The app module renames its own output (see app/build.gradle.kts), so this glob
      # picks up karoo-insta360-<version>.apk rather than a generic app-release.apk.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: karoo-insta360-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
